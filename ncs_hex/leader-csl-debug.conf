# Leader (nRF52840 DK) built for CSL transmitter debugging.
#
# The stock cli sample links Nordic's prebuilt OpenThread library, which has logging
# compiled out, so nothing of what the CSL transmitter decides is observable. Building
# OpenThread from source brings back Mac/CslTxScheduler debug logs, in particular the
# "Timestamp=... CslPeriod=... CslPhase=... TransmitPhase=..." line that shows which
# sample time the parent derived for the child.
#
# Usage (from /home/luma/ncs/v3.3.0/nrf/samples/openthread/cli):
#   west build -b nrf52840dk/nrf52840 -d build-csl-debug --sysbuild -- \
#       -Dcli_EXTRA_CONF_FILE=/home/luma/Workspace/ot-nrf528xx/ncs_hex/leader-csl-debug.conf

CONFIG_OPENTHREAD_SOURCES=y

# Compile every level in, but keep the runtime level low so the shell stays parseable;
# raise it with "ot log level 5" around the traffic of interest.
CONFIG_LOG=y
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_DEBG=y
CONFIG_OPENTHREAD_LOG_LEVEL_DYNAMIC=y

# Deferred logging with room to spare: immediate mode would serialise every line onto a
# 115200 baud UART from the logging call site and skew the very transmit timing we measure.
CONFIG_LOG_BUFFER_SIZE=16384

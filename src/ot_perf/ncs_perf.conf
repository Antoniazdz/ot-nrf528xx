# Kconfig overlay that adds the `ot perf` throughput command to the NCS OpenThread CLI sample.
#
#   cd $NCS/nrf/samples/openthread/cli
#   west build -p always -b nrf54l15dk/nrf54l15/cpuapp -- \
#       -DEXTRA_CONF_FILE=<abs path>/src/ot_perf/ncs_perf.conf
#
# The vendor extension is wired in by openthread/src/cli/CMakeLists.txt, so OpenThread has to be
# compiled from sources. With the default CONFIG_OPENTHREAD_LIBRARY=y the sample links the
# precompiled nrfxlib OpenThread library and the extension is silently dropped from the image.
CONFIG_OPENTHREAD_SOURCES=y

# Absolute path - the file is include()d from the OpenThread CLI CMakeLists, not from the app.
CONFIG_OPENTHREAD_CLI_VENDOR_EXTENSION="/home/anzd/src/ot-nrf54L/ot-nrf528xx/src/ot_perf/ot_perf.cmake"

# Match OPENTHREAD_CONFIG_NUM_MESSAGE_BUFFERS of the bare-metal port. The message pool is what
# limits an unpaced UDP sender, so leaving the two builds at different values would measure the
# buffer counts rather than the stacks.
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=128
